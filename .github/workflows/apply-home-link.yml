name: apply-home-link
on:
  push:
    branches: [cursor/gallery-home-button-c714]
    paths: ['.github/workflows/apply-home-link.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/gallery-home-button-c714
          fetch-depth: 0
      - name: Insert Home into the gallery header and preserve list
        run: |
          set -euo pipefail
          git checkout deb0a9cbcb76a31ba9f4f20bd5ea7e6cc0031bbd -- index.html tools/gallery_template.html tools/gallery_phase1.py
          python3 << 'PY'
          from pathlib import Path
          css_old = "    .country-switch a { color: var(--accent); text-decoration: none; }\n    .country-switch a:hover { text-decoration: underline; }"
          css_new = "    .country-switch a { color: var(--accent); text-decoration: none; }\n    .home-link{font-weight:700}\n    .country-switch a:hover { text-decoration: underline; }"
          nav_old = '    <nav class="country-switch" aria-label="Country galleries">\n      <a href="https://germany.jdvision.org/">'
          nav_new = '    <nav class="country-switch" aria-label="Country galleries">\n      <a class="home-link" href="https://jdvision.org/">&#8962; Home</a>\n      <span class="sep" aria-hidden="true">|</span>\n      <a href="https://germany.jdvision.org/">'
          for rel in ("index.html", "tools/gallery_template.html"):
              path = Path(rel)
              text = path.read_text(encoding="utf-8")
              if text.count(css_old) != 1 or text.count(nav_old) != 1:
                  raise SystemExit(f"patch anchors missing in {rel}")
              text = text.replace(css_old, css_new, 1).replace(nav_old, nav_new, 1)
              if not text.rstrip().endswith("</html>"):
                  raise SystemExit(f"{rel} is truncated")
              if text.count('class="home-link"') != 1 or text.count(".home-link{font-weight:700}") != 1:
                  raise SystemExit(f"{rel} home markup missing")
              path.write_text(text, encoding="utf-8")
          path = Path("tools/gallery_phase1.py")
          text = path.read_text(encoding="utf-8")
          old_fn = "            raise SystemExit(f\"phase-1 thumbnail missing on disk for {entry_id}: {row[3]}\")\n\n\ndef assert_phase1(html: str, meta: dict[str, list]) -> None:"
          new_fn = """            raise SystemExit(f"phase-1 thumbnail missing on disk for {entry_id}: {row[3]}")


def _assert_home_link(nav: str) -> None:
    \"\"\"Keep the Home control first in the switcher so a rebuild cannot drop it.\"\"\"
    home = '<a class="home-link" href="https://jdvision.org/">&#8962; Home</a>'
    inner = nav.split(">", 1)[1] if ">" in nav else ""
    if not inner.lstrip().startswith(home):
        raise SystemExit("home link must be the first country-switch item and point at https://jdvision.org/")
    between = inner.lstrip()[len(home):inner.lstrip().find('href="https://germany.jdvision.org/"')]
    if between.count('<span class="sep"') != 1:
        raise SystemExit("home link must be followed by the switcher separator")


def assert_phase1(html: str, meta: dict[str, list]) -> None:"""
          old_req = '        "phase1Enhance",\n        "getAttribute",'
          new_req = '        "phase1Enhance",\n        \'class="home-link"\',\n        \'href="https://jdvision.org/"\',\n        ".home-link{font-weight:700}",\n        "&#8962; Home",\n        "getAttribute",'
          old_call = '        raise SystemExit(f"switcher order is not Germany\u2192United Kingdom: {positions}")\n    if "linear-gradient(#fff,#fff) center/45% 22%" not in html:'
          new_call = '        raise SystemExit(f"switcher order is not Germany\u2192United Kingdom: {positions}")\n    _assert_home_link(nav)\n    if "linear-gradient(#fff,#fff) center/45% 22%" not in html:'
          for name, old, new in (("fn", old_fn, new_fn), ("req", old_req, new_req), ("call", old_call, new_call)):
              if text.count(old) != 1:
                  raise SystemExit(f"phase-1 anchor missing: {name}")
              text = text.replace(old, new, 1)
          if "def _assert_home_link" not in text:
              raise SystemExit("home assert was not inserted")
          path.write_text(text, encoding="utf-8")
          PY
          git add index.html tools/gallery_template.html tools/gallery_phase1.py
          git rm -f .github/workflows/apply-home-link.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add Home link to the gallery header."
          git push origin HEAD:cursor/gallery-home-button-c714
